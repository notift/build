# De herbruikbare workflow van Notift. Doel 1 van docs/07-bouwlaag.md.
#
# Deze staat in de repo notift/build als .github/workflows/build-and-publish.yml
# en wordt door elk project aangeroepen. Niet kopieren naar klantrepo's: dan
# heb je twintig versies die uit elkaar lopen.
#
# Een project roept hem zo aan, met een vastgezette versie:
#
#   jobs:
#     publiceren:
#       uses: notift/build/.github/workflows/build-and-publish.yml@v1
#       permissions:
#         contents: read
#         packages: write
#
# TWEE JOBS, EN DAT IS EEN GRENS EN GEEN OPMAAK.
#
# `bouwen` draait de code van de klant. Een `npm install` voert scripts uit die
# hij geschreven heeft, dus die job heeft alleen leesrecht en ziet nooit het
# token waarmee gepubliceerd wordt.
#
# `publiceren` draait geen enkele regel van de klant. Hij haalt het gebouwde
# resultaat op als artefact, keurt het opnieuw, en pakt de Dockerfile uit onze
# eigen repo in plaats van uit dat artefact. Dat laatste is het punt: het
# artefact komt uit een job waar vreemde code in draaide, dus alles eruit is
# invoer en geen configuratie.
#
# Waarom opnieuw keuren: het artefact is de brug tussen de twee jobs. Wat er in
# job 1 gekeurd is, hoeft niet te zijn wat er in job 2 uit komt.
#
# Elke `uses:` hieronder staat vast op een commit-hash. Een tag kan verplaatst
# worden, een hash niet, en dat is de enige manier om te weten welke code een
# image van ons gebouwd heeft. De versie erachter staat er als commentaar, zodat
# je kunt zien wat je hebt. Vastgezet 2026-09-04.
#
# Bijwerken is met opzet handwerk: haal de hash op met
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# en controleer daarna of de invoerwaarden die wij gebruiken nog bestaan. Zolang
# dit niet gebeurt komt een beveiligingsfix in een action hier niet binnen, en
# dat is de prijs van vastzetten.

name: Bouwen en publiceren

on:
  workflow_call:
    inputs:
      manifest:
        description: "Pad naar het manifest in de repo van het project"
        type: string
        default: "notift.json"
    secrets:
      NOTIFT_DEPLOY_SECRET:
        description: "HMAC-geheim van de gekoppelde repository"
        required: false
    outputs:
      digest:
        description: "De digest van het gepubliceerde image. Hierop wordt uitgerold"
        value: ${{ jobs.publiceren.outputs.digest }}
      image:
        description: "De volledige, onveranderlijke imageverwijzing"
        value: ${{ jobs.publiceren.outputs.image }}
      build:
        description: "Het buildnummer: datum plus commit"
        value: ${{ jobs.bouwen.outputs.build }}
      module:
        description: "De module waartoe het image hoort"
        value: ${{ jobs.publiceren.outputs.module }}
      project:
        description: "Het project waartoe de module hoort"
        value: ${{ jobs.publiceren.outputs.project }}
      package:
        description: "Het vaste ghcr-pakket van de module"
        value: ${{ jobs.publiceren.outputs.package }}
      repository:
        description: "De bronrepo van deze run"
        value: ${{ jobs.publiceren.outputs.repository }}
      ref:
        description: "De Git-ref van deze run"
        value: ${{ jobs.publiceren.outputs.ref }}
      commit:
        description: "De volledige broncommit van deze run"
        value: ${{ jobs.publiceren.outputs.commit }}
      workflow:
        description: "De onveranderlijke commit van de bouwlaag"
        value: ${{ jobs.publiceren.outputs.workflow }}
      run_id:
        description: "De GitHub Actions-run"
        value: ${{ jobs.publiceren.outputs.run_id }}
      run_attempt:
        description: "De poging van de GitHub Actions-run"
        value: ${{ jobs.publiceren.outputs.run_attempt }}

# Least privilege for any job that does not name its own permissions. Both jobs below do, and a
# caller can only narrow these further (docs/prompts/geheel-build-23-oplevering.md).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: hier draait de code van de klant. Geen packages:write, geen token.
  # ---------------------------------------------------------------------------
  bouwen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.nummer.outputs.build }}
      organisation: ${{ steps.manifest.outputs.organisation }}
      project: ${{ steps.manifest.outputs.project }}
      module: ${{ steps.manifest.outputs.module }}
      plan: ${{ steps.manifest.outputs.plan }}
      package: ${{ steps.manifest.outputs.package }}
      workflow: ${{ steps.bouwlaag.outputs.sha }}

    steps:
      - name: De repo van het project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: De vaste bouwlaag bepalen
        id: bouwlaag
        # Buiten GITHUB_WORKSPACE: een klantbuild die alles naar dist kopieert
        # kan deze map niet meenemen. v1 wordt precies eenmaal naar een hash
        # opgelost; job 2 haalt daarna die hash op, nooit v1 opnieuw.
        env:
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/notift/build.git 'refs/tags/v1^{}' | awk 'NR==1 {print $1}')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::v1 van notift/build kon niet naar een commit worden opgelost"; exit 1; }
          git clone --quiet --no-checkout https://github.com/notift/build.git "$BUILD_LAYER_DIR"
          git -C "$BUILD_LAYER_DIR" checkout --quiet --detach "$SHA"
          ACTUAL="$(git -C "$BUILD_LAYER_DIR" rev-parse HEAD)"
          test "$ACTUAL" = "$SHA" || { echo "::error::bouwlaag wees na checkout naar $ACTUAL, verwacht $SHA"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Het manifest lezen
        id: manifest
        env:
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          test -f "$MANIFEST_PATH" || { echo "::error::$MANIFEST_PATH ontbreekt in deze repo. Zie de README van de bouwlaag."; exit 1; }
          python3 "$BUILD_LAYER_DIR/checks/check_output.py" --github-output "$MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Het buildnummer
        id: nummer
        # Datum plus commit, doel 5. Geen volgnummer van GitHub: dat begint
        # opnieuw als een repo verhuist, en bij DWY ligt het bij de klant.
        run: echo "build=$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.manifest.outputs.node }}
          cache: ${{ steps.manifest.outputs.manager }}

      - name: Pakketten installeren
        env:
          MANAGER: ${{ steps.manifest.outputs.manager }}
        run: |
          set -euo pipefail
          case "$MANAGER" in
            npm)  npm ci ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --immutable ;;
            *)    echo "::error::onbekende pakketmanager"; exit 1 ;;
          esac

      - name: Bouwen
        env:
          BUILD_COMMAND: ${{ steps.manifest.outputs.command }}
        run: |
          set -euo pipefail
          read -r -a COMMAND <<< "$BUILD_COMMAND"
          "${COMMAND[@]}"

      - name: De uitvoer keuren
        # Doel 4. Weigeren op wat SEO of veiligheid breekt, waarschuwen op de
        # rest. Dit kijkt naar wat er werkelijk uit de build kwam en raadt niets
        # uit de broncode. Job 2 doet dit nog een keer.
        env:
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
          BUILD_OUTPUT: ${{ steps.manifest.outputs.output }}
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: python3 "$BUILD_LAYER_DIR/checks/check_output.py" "$BUILD_OUTPUT" "$MANIFEST_PATH"

      - name: Het resultaat doorgeven
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ steps.manifest.outputs.output }}
          # Hier staat gebouwde code van een klant in. Zo kort mogelijk bewaren.
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: hier draait geen code van de klant. Alleen hier ligt het token.
  # ---------------------------------------------------------------------------
  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publiceren.outputs.digest }}
      image: ${{ steps.referentie.outputs.image }}
      module: ${{ needs.bouwen.outputs.module }}
      project: ${{ needs.bouwen.outputs.project }}
      package: ${{ needs.bouwen.outputs.package }}
      repository: ${{ steps.herkomst.outputs.repository }}
      ref: ${{ steps.herkomst.outputs.ref }}
      commit: ${{ steps.herkomst.outputs.commit }}
      workflow: ${{ needs.bouwen.outputs.workflow }}
      run_id: ${{ steps.herkomst.outputs.run_id }}
      run_attempt: ${{ steps.herkomst.outputs.run_attempt }}

    steps:
      - name: De repo van het project
        # Alleen voor het manifest, en met opzet vers in plaats van via het
        # artefact. Wat door job 1 heen komt is aangeraakt door de klant.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dezelfde vaste bouwlaag ophalen
        env:
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
          EXPECTED_SHA: ${{ needs.bouwen.outputs.workflow }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job 1 gaf geen geldige bouwlaaghash door"; exit 1; }
          git init --quiet "$BUILD_LAYER_DIR"
          git -C "$BUILD_LAYER_DIR" remote add origin https://github.com/notift/build.git
          git -C "$BUILD_LAYER_DIR" fetch --quiet --depth=1 origin "$EXPECTED_SHA"
          git -C "$BUILD_LAYER_DIR" checkout --quiet --detach FETCH_HEAD
          ACTUAL_SHA="$(git -C "$BUILD_LAYER_DIR" rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "::error::bouwlaaghash wijkt af: $ACTUAL_SHA, verwacht $EXPECTED_SHA"; exit 1; }

      - name: Het resultaat ophalen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .notift-context/site

      - name: De uitvoer opnieuw keuren
        # Het artefact is de brug tussen twee jobs, en job 1 draaide vreemde
        # code. Wat daar goedgekeurd is, hoeft niet te zijn wat hier aankomt.
        env:
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: python3 "$BUILD_LAYER_DIR/checks/check_output.py" .notift-context/site "$MANIFEST_PATH"

      - name: Het formulierscript van het platform
        # The forms script comes from this build layer at the pinned hash, never from the customer
        # and never from the dashboard at run time. /_notift/ is reserved: whatever the customer
        # build put there is removed first, so a planted forms.js (or a symlink) cannot survive.
        # Placed before compression so nginx also serves a gzip copy.
        env:
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
        run: |
          set -euo pipefail
          rm -rf .notift-context/site/_notift
          install -d -m 0755 .notift-context/site/_notift .notift-context/site/_notift/embed
          install -m 0644 "$BUILD_LAYER_DIR/embed/forms.js" .notift-context/site/_notift/embed/forms.js
          cmp "$BUILD_LAYER_DIR/embed/forms.js" .notift-context/site/_notift/embed/forms.js

      - name: Vooraf comprimeren
        # Wat je zelf kunt oplossen, moet je niet aan de klant melden. nginx
        # serveert deze bestanden kant-en-klaar, zie gzip_static in nginx.conf.
        # Dit gebeurt hier en niet in job 1, zodat de keuring hierboven naar
        # gewone bestanden kijkt en niet naar gecomprimeerde.
        run: |
          set -euo pipefail
          find .notift-context/site \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.json' \) \
            -size +1k -exec gzip -9 -k -f {} \;

      - name: Het gezondheidspad stempelen
        # Doel 5 van de runtime-laag: de uitrol vraagt hier het buildnummer op en
        # vergelijkt het met wat hij verwachtte. Zonder dit weet je niet met
        # welke versie je praat. Het wordt hier gezet en niet in job 1, want de
        # klant mag dit nummer niet kunnen schrijven.
        env:
          BUILD: ${{ needs.bouwen.outputs.build }}
        run: printf '%s' "$BUILD" > .notift-context/site/_health

      - name: De bouwcontext klaarzetten
        # De Dockerfile komt uit onze eigen repo en niet uit het artefact.
        env:
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
        run: cp "$BUILD_LAYER_DIR/base/site.Dockerfile" .notift-context/Dockerfile

      - name: Inloggen bij ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publiceren
        id: publiceren
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .notift-context
          push: true
          # Punt 8 van het contract: de machines zijn x86. Een image voor de
          # verkeerde architectuur start niet, en dat wil je hier merken.
          platforms: linux/amd64
          tags: ${{ needs.bouwen.outputs.package }}:${{ needs.bouwen.outputs.build }}
          # BASE staat op een digest en niet op de tag `:1`, om dezelfde reden
          # waarom deploy.sh alleen een digest accepteert: een tag kan
          # verplaatsen, en dan levert een herbouw van dezelfde klantcode
          # stilletjes een andere webserver op. Een nieuw basisimage bereikt een
          # klant pas als deze regel bewust bijgewerkt wordt.
          #
          # Let op: in dit blok is elke regel een bouwparameter. Commentaar hoort
          # hierboven, want daarbinnen wordt het als een parameter meegegeven.
          # Dat is een keer gebeurd en het viel pas op in de log van een run.
          build-args: |
            BASE=ghcr.io/notift/static-base@sha256:64f027ffbac7d0204ded361954e423bd075c0b88f1b6bb57749acccae8812c83
            BUILD=${{ needs.bouwen.outputs.build }}
            ORGANISATION=${{ needs.bouwen.outputs.organisation }}
            PROJECT=${{ needs.bouwen.outputs.project }}
            MODULE=${{ needs.bouwen.outputs.module }}
            PLAN=${{ needs.bouwen.outputs.plan }}
            COMMIT=${{ github.sha }}
            REPO=${{ github.repository }}
            WORKFLOW=notift/build@${{ needs.bouwen.outputs.workflow }}

      - name: De onveranderlijke imageverwijzing
        id: referentie
        env:
          PACKAGE: ${{ needs.bouwen.outputs.package }}
          DIGEST: ${{ steps.publiceren.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build-push gaf geen digest terug"; exit 1; }
          echo "image=$PACKAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Herkomst voor de volgende laag
        id: herkomst
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for V in REPOSITORY REF COMMIT RUN_ID RUN_ATTEMPT; do printf '%s=%s\n' "${V,,}" "${!V}" >> "$GITHUB_OUTPUT"; done

      - name: Staging aan het platform melden
        env:
          NOTIFT_DEPLOY_SECRET: ${{ secrets.NOTIFT_DEPLOY_SECRET }}
          BUILD_LAYER_DIR: ${{ runner.temp }}/notift-build
          BUILD: ${{ needs.bouwen.outputs.build }}
          IMAGE: ${{ steps.referentie.outputs.image }}
          MODULE: ${{ needs.bouwen.outputs.module }}
          PROJECT: ${{ needs.bouwen.outputs.project }}
          PACKAGE: ${{ needs.bouwen.outputs.package }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ needs.bouwen.outputs.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 "$BUILD_LAYER_DIR/checks/notify_deployment.py"

      - name: Wat je hierna nodig hebt
        env:
          BUILD: ${{ needs.bouwen.outputs.build }}
          IMAGE: ${{ steps.referentie.outputs.image }}
          MODULE: ${{ needs.bouwen.outputs.module }}
          PROJECT: ${{ needs.bouwen.outputs.project }}
          PACKAGE: ${{ needs.bouwen.outputs.package }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ needs.bouwen.outputs.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            echo "### Gepubliceerd"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Build | \`$BUILD\` |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Module | \`$MODULE\` |"
            echo "| Project | \`$PROJECT\` |"
            echo "| Pakket | \`$PACKAGE\` |"
            echo "| Repo | \`$REPOSITORY\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Bouwlaag | \`$WORKFLOW\` |"
            echo "| Run | \`$RUN_ID\`, poging \`$RUN_ATTEMPT\` |"
            echo ""
            echo "Uitrollen:"
            echo ""
            echo '```'
            echo "sudo ./deploy.sh $MODULE $IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
