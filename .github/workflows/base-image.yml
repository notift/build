# Het basisimage van Notift bouwen en publiceren. Doel 2 van docs/07-bouwlaag.md.
#
# Dit draait niet vanzelf. Een basisimage dat verandert zonder dat iemand het
# vraagt, verandert onder elke klant tegelijk, en dat wil je zien gebeuren.
# Daarom met de hand starten: Actions, deze workflow, Run workflow.
#
# Het resultaat is ghcr.io/notift/static-base:<versie>. De projectworkflow
# verwijst naar een vaste versie, dus een nieuwe versie raakt pas een site als
# die verwijzing bijgewerkt wordt.

name: Het basisimage

on:
  workflow_dispatch:
    inputs:
      versie:
        description: "De versie die gepubliceerd wordt, bijvoorbeeld 1"
        type: string
        required: true
        default: "1"

jobs:
  publiceren:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: De bouwlaag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inloggen bij ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouwen en publiceren
        id: publiceren
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: base
          push: true
          # Punt 8 van het contract: de machines zijn x86.
          platforms: linux/amd64
          tags: ghcr.io/notift/static-base:${{ inputs.versie }}

      - name: Nakijken dat het image is wat het moet zijn
        # Geinstalleerd is niet actief, aanwezig is niet aangekomen. Dit haalt
        # het gepubliceerde image op via zijn digest en controleert de drie
        # dingen waar de runtimelaag op leunt: geen root, poort 8080, en een
        # gezondheidspad dat antwoordt op een alleen-lezen bestandssysteem.
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/notift/static-base@${{ steps.publiceren.outputs.digest }}"
          docker pull -q "$IMAGE"

          GEBRUIKER="$(docker inspect -f '{{.Config.User}}' "$IMAGE")"
          test "$GEBRUIKER" = "nginx" || { echo "::error::draait als '$GEBRUIKER' in plaats van nginx"; exit 1; }
          echo "  ok   draait als $GEBRUIKER"

          docker inspect -f '{{json .Config.ExposedPorts}}' "$IMAGE" | grep -q '8080/tcp' \
            || { echo "::error::poort 8080 wordt niet aangeboden"; exit 1; }
          echo "  ok   biedt poort 8080 aan"

          # Precies zoals de runtimelaag hem straks start: alleen-lezen, alle
          # rechten weg, en /tmp als enige plek om te schrijven.
          docker run -d --name proef --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m -p 8080:8080 "$IMAGE"
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/_health || true)"
            [ "$code" = "404" ] && break   # nog geen site erin, dus 404 is goed
            sleep 1
          done
          docker logs proef
          test "$code" = "404" || { echo "::error::het gezondheidspad antwoordt niet, code $code"; exit 1; }
          echo "  ok   draait alleen-lezen en antwoordt op /_health"

      - name: Wat je hierna nodig hebt
        run: |
          {
            echo "### Het basisimage staat er"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`ghcr.io/notift/static-base:${{ inputs.versie }}\` |"
            echo "| Digest | \`${{ steps.publiceren.outputs.digest }}\` |"
            echo ""
            echo "**Dit pakket is publiek.** Zet nooit iets in dit image dat niet openbaar mag zijn."
            echo ""
            echo "Werk daarna de regel \`BASE=\` in build-and-publish.yml bij naar deze digest."
            echo "Zonder die wijziging bouwt elk project gewoon door op de vorige versie, en dat is de bedoeling."
          } >> "$GITHUB_STEP_SUMMARY"
