# De webserver die Notift in elk statisch image stopt. Zie docs/07-bouwlaag.md,
# doel 2: de klant levert een map, Notift levert de webserver.
#
# Deze configuratie is geschreven om te draaien onder de runtime-laag:
# alleen-lezen bestandssysteem, als gewone gebruiker, en met /tmp als enige
# plek waar geschreven mag worden. Zie doel 3 in docs/06-runtime.md.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout combined;

  # Alles wat nginx normaal naar schijf schrijft, gaat naar /tmp. Zonder deze
  # vijf regels start hij niet op een alleen-lezen bestandssysteem.
  client_body_temp_path /tmp/body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # De build levert de bestanden vooraf gecomprimeerd aan. nginx serveert die
  # kant-en-klaar in plaats van bij elk verzoek opnieuw te comprimeren.
  gzip_static  on;
  # Vary: Accept-Encoding bij een gecomprimeerd antwoord. Zonder kan een gedeelde cache een
  # gzip-antwoord geven aan een client die het niet vroeg (audit K 6).
  gzip_vary    on;
  # Brotli zit niet in de standaard nginx. Zodra het basisimage een build met
  # die module krijgt, komt hier brotli_static aan.

  # Voor de redirects per pad hieronder: tot 2000 regels van 1000 tekens (checks/redirects.py), elk in twee
  # vormen. Moet voor het eerste map-blok staan, anders geldt de standaard al. nginx -t in de build meet het.
  map_hash_max_size     8192;
  map_hash_bucket_size  2048;

  # Het adres zonder .html voor wat de bezoeker zelf vroeg, of leeg. Leeg bij een
  # interne doorverwijzing, want $request_uri blijft dan het oorspronkelijke adres.
  map $request_uri $notift_html_doel {
    "~^(?<notift_map>/(?:[^?]*/)?)index\.html(?:\?.*)?$"   $notift_map;
    "~^(?<notift_pagina>/[^?]+)\.html(?:\?.*)?$"          $notift_pagina;
    default                                                "";
  }

  # Redirects per pad (docs/07-bouwlaag.md, "Redirects per pad"). De build zet _redirects van de site om
  # in redirects.map (checks/redirects.py); zonder lijst is dat bestand leeg en gebeurt er niets.
  # Het pad zoals de bezoeker het vroeg, zonder querystring en ongedecodeerd. $request_uri en niet $uri:
  # $uri verandert bij een interne doorverwijzing (/ naar /index.html, een 404 naar /404.html).
  map $request_uri $notift_redirect_path {
    "~^(?<notift_rpad>[^?]*)"  $notift_rpad;
  }
  # De klant levert alleen regels in deze map, nooit een directive. Een regel is
  # "<bron>" "<bron> <code> <bestemming>".
  map $notift_redirect_path $notift_redirect_rule {
    default  "";
    include  /etc/nginx/notift/redirects.map;
  }
  # De hashtabel van een map let niet op hoofdletters (gemeten 22 oktober 2026). Deze stap maakt het
  # exact, zoals bij Netlify en Vercel: alleen als de bron letterlijk het gevraagde pad is.
  map "$notift_redirect_path $notift_redirect_rule" $notift_redirect {
    "~^(?<notift_rbron>\S+) \k<notift_rbron> (?<notift_rdoel>30[1278] \S+)$"  $notift_rdoel;
    default  "";
  }
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Doorverwijzingen zonder schema en host. Achter Traefik kent nginx alleen zijn
    # eigen poort, en een absolute doorverwijzing stuurde bezoekers naar
    # http://<host>:8080/ (24 september 2026, test.notift.nl/bedankt).
    absolute_redirect off;

    # Redirects per pad. Op serverniveau, dus voor elke location en voor try_files: een redirect wint
    # van een bestaand bestand, en van de slash- en .html-regels hieronder. De querystring gaat mee.
    # return kent geen variabele statuscode, vandaar vier regels.
    if ($notift_redirect ~ "^301 (.+)$") { return 301 $1$is_args$args; }
    if ($notift_redirect ~ "^302 (.+)$") { return 302 $1$is_args$args; }
    if ($notift_redirect ~ "^307 (.+)$") { return 307 $1$is_args$args; }
    if ($notift_redirect ~ "^308 (.+)$") { return 308 $1$is_args$args; }

    # Doel 5 van de runtime-laag: de uitrol meet hier het buildnummer na.
    # "Het proces leeft" is niet genoeg, en "de homepagina geeft 200" ook niet.
    location = /_health {
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      try_files /_health =404;
    }

    # security.txt (RFC 9116) van Notift, ook als de klant zelf een .well-known-map levert.
    # Exact pad, dus voorrang op de map van de klant. Vervalt op de datum in het bestand: een
    # nieuw basisimage en een uitrol van elke site vóór die datum (draaiboek in oplevering 30).
    # RFC 9116 vraagt text/plain met charset=utf-8.
    location = /.well-known/security.txt {
      default_type text/plain;
      charset utf-8;
      add_header Cache-Control "public, max-age=86400" always;
      alias /etc/nginx/notift/security.txt;
    }

    # Bestanden met een versie in de naam veranderen nooit meer van inhoud, dus
    # die mogen een jaar in de cache. De naam wijzigt als de inhoud wijzigt.
    # Een streepje of een punt voor de hash: Webflow schrijft webflow.schunk.fd781c85001fb43f.js.
    # Minstens één letter a tot f in de hash: foto-20261018.jpg is een datum, geen versie, en een
    # vervangen foto met die naam bleef anders een jaar oud (audit K 6 en 8).
    location ~* "[.-](?=[0-9]*[a-f])[0-9a-f]{8,}\.(js|css|woff2?|png|jpe?g|webp|avif|svg)$" {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Een pagina heeft een adres zonder .html. /contact.html en /index.html sturen
    # door, zodat een zoekmachine geen tweede adres voor dezelfde pagina leert.
    # Alleen wat de bezoeker zelf vroeg: voor / leidt nginx intern door naar
    # /index.html, en een regel op $uri stuurde / naar / in een lus (24 september
    # 2026). Daarom bepaalt de map bovenaan het doel uit $request_uri.
    location ~ "\.html$" {
      set $notift_redirect "";
      if (-f $request_filename) {
        set $notift_redirect $notift_html_doel;
      }
      if ($notift_redirect) {
        return 301 $notift_redirect$is_args$args;
      }
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      try_files $uri =404;
    }

    # Een slash aan het eind: bestaat er een pagina zonder, dan daarheen, zoals
    # Webflow deed (/contact/ naar /contact). Een echte map met een index.html
    # blijft op zijn adres met slash.
    location ~ "^(?<zonder>/.+)/$" {
      if (-f $document_root$zonder.html) {
        return 301 $zonder$is_args$args;
      }
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      try_files $uri/index.html =404;
    }

    # Alles zonder versie in de naam: elke keer navragen of het nog klopt.
    # Zo ziet een terugkerende bezoeker een wijziging meteen.
    location / {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      # `=404` en niet `/404.html`: noem je hier een bestand, dan serveert nginx
      # dat als een gewone pagina met status 200. De inhoud klopt dan, de code
      # niet, en Google ziet elke niet-bestaande URL als een echte pagina. Een
      # soft 404 dus. De `error_page` hieronder levert de pagina, met 404.
      #
      # `$uri.html` voor `$uri/`: staan /klachten.html en de map /klachten/
      # allebei in de site, dan stuurde `$uri/` door naar /klachten/, en de
      # slash-regel hierboven weer terug. Een lus (1 oktober 2026, SiSO).
      try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
